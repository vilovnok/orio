[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiagent_system"
version = "0.1.0"
description = "AI Agent for conversation with user"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aiohttp==3.9.0",
    "pystalkd==1.3.0",
    "python-jose==3.4.0",
    "environs==14.1.1",
    "elasticsearch==8.17.2",
    "python-dotenv==1.0.1",
    "langchain==0.3.22",
    "langchain-core==0.3.49",
    "langgraph[cli]==0.3.22",
    "langchain-openai==0.3.11",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "pydantic==2.11.4",
    "redis==5.2.1",
    "furl==2.1.4",
    "orderedmultidict==1.0.1",
    "url-normalize==2.2.1",
    "uvicorn==0.34.2",
    "starlette==0.46.2",
    "sse-starlette==2.3.5",
    "httpx==0.28.1",
    "httpx-sse==0.4.0",
    "opentelemetry-instrumentation-starlette==0.54b0",
    "aiogram==3.20.0.post0",
    "pytest[dev]==8.3.5",
    "fastapi>=0.115.12",
    "graypy==2.1.0",
    "prometheus-client>=0.22.1",
    "langgraph-cli[inmem]>=0.1.59",
    "notebook>=7.4.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "lang>=0.1",
    "sentence-transformers>=6.1.0",
    "langchain-gigachat>=0.3.12",
    "a2a-sdk[all,http-server]>=0.3,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
run-beanstalkd-worker = "src.cli:main"
run-a2a = "src.copilot.a2a_server.run:main"
